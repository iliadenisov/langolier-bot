name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:"; echo "$out"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -count=1 ./...

      - name: docker build
        run: docker build -t langolier-bot:ci .

  deploy:
    needs: test
    if: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: self-hosted
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      NO_COLOR: "1"
      DOCKER_CLI_HINTS: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Registry login (private sidecar registry only)
        if: ${{ vars.REGISTRY_HOST != '' }}
        env:
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin

      - name: Build and (re)deploy
        working-directory: deploy
        env:
          SIDECAR_IMAGE: ${{ vars.SIDECAR_IMAGE }}
          AWG_CONF: ${{ secrets.AWG_CONF }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_OWNER_ID: ${{ vars.BOT_OWNER_ID }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          VERSION: ${{ github.sha }}
        run: |
          docker compose -p langolier --ansi never --progress plain build
          docker compose -p langolier --ansi never up -d --remove-orphans --force-recreate

      - name: Probe
        working-directory: deploy
        run: bash ./probe.sh langolier

      - name: Prune dangling images
        if: always()
        run: docker image prune -f
